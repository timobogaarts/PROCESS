[pytest]
log_level = WARNING

# The pure-functional port's tier markers. `tests/functional_process/conftest.py`
# registers these too, and is the source of truth for what they mean -- but its
# `pytest_configure` only runs as an *initial* hook, i.e. when the invocation targets
# that subtree (`pytest tests/functional_process`). A rootdir-wide `pytest tests` picks
# the conftest up too late for that, so the marks need declaring here as well or every
# contract class warns `PytestUnknownMarkWarning` on collection.
markers =
    tier1: explicit pure function, value + gradient
    tier2: internal solver, residual-based criterion
    tier3: acyclic composition of ported units
    tier4: full coupled MDA
    gradient: compares against PROCESS's finite difference; opt-in
